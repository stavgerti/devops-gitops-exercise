apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start a new pod before removing an old one, so serving capacity never drops below 2.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          # Rewritten by .github/workflows/ci.yaml on every deploy (tag = commit SHA). Public GHCR image, no pull secret.
          image: ghcr.io/stavgerti/devops-gitops-exercise:4f2fcf4f74d125aad3cc5995d6f3d9d4c7a55ae5
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Keep serving for a few seconds so Traefik stops routing here before SIGTERM arrives.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # startupProbe: runs first; readiness and liveness wait until it passes. Allows a slow start up to
          # 60s (30 x 2s); if it never passes, the container is restarted.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          # readinessProbe: on failure the pod stops getting traffic from the Service, but is not restarted.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          # livenessProbe: on failure the container is restarted.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # 200m throttled gunicorn's startup (3 Python processes importing Flask).
              cpu: 500m
              memory: 128Mi
