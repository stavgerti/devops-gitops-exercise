name: ci

on:
  push:
    branches: [main]
    # The deploy commit only touches k8s/, so it cannot retrigger this workflow
    # (and pushes made with GITHUB_TOKEN never trigger workflows anyway).
    paths: ["app/**", ".github/workflows/ci.yaml"]
  workflow_dispatch:

# Least privilege: push an image to GHCR and a commit to this repo, nothing else.
permissions:
  contents: write
  packages: write

# One run at a time so two deploy commits never race.
concurrency:
  group: ci
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Fail before anything is pushed or deployed. Same Python image as the Dockerfile.
      - name: Unit tests
        run: >
          docker run --rm -v "$PWD/app:/src:ro" -w /src python:3.13-slim
          sh -c "pip install -q -r requirements.txt pytest==9.2.0 && python -m pytest -q -p no:cacheprovider"

      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push, tagged with the commit SHA
        uses: docker/build-push-action@v7.4.0
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

      - name: Point the Deployment at the new image (Argo CD rolls it out)
        run: |
          # Only the image: line may change (exactly one line), otherwise fail before committing.
          sed -i -E "s|^( *image: ).*|\1${IMAGE}:${GITHUB_SHA}|" k8s/deployment.yaml
          test "$(git diff --numstat k8s/deployment.yaml | cut -f1,2 | tr '\t' ' ')" = "1 1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: deploy ${GITHUB_SHA::7}"
          git pull --rebase
          git push
